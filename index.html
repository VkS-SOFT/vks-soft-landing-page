<!doctype html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-dark-bg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VKS Soft | Software para Construção Civil e Mercado Imobiliário</title>
    <meta name="description" content="Software especialista em construção civil e mercado imobiliário: gestão de obras, laudos de avaliação, CRM imobiliário e sites para construtoras, imobiliárias e escritórios de engenharia." />
    <meta name="theme-color" content="#501BED" />
    <link rel="canonical" href="https://vkssoft.vercel.app/" />

    <!-- Prévia de link (WhatsApp, LinkedIn, Facebook): URLs absolutas são obrigatórias -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="VKS Soft" />
    <meta property="og:url" content="https://vkssoft.vercel.app/" />
    <meta property="og:title" content="VKS Soft | Software para Construção Civil e Mercado Imobiliário" />
    <meta property="og:description" content="Sistemas, apps e sites para construtoras, imobiliárias e escritórios de engenharia e arquitetura. Gestão de obras, laudos NBR 14653 e CRM imobiliário." />
    <meta property="og:image" content="https://vkssoft.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://vkssoft.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VKS Soft: software especialista em construção civil e mercado imobiliário" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VKS Soft | Software para Construção Civil e Mercado Imobiliário" />
    <meta name="twitter:description" content="Sistemas, apps e sites para construtoras, imobiliárias e escritórios de engenharia e arquitetura." />
    <meta name="twitter:image" content="https://vkssoft.vercel.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-vks-black text-vks-white antialiased selection:bg-vks-primary selection:text-vks-onPrimary overflow-x-hidden">
    <script>
      // Aplica o tema antes do React montar, evitando piscar o tema errado.
      // Claro é o padrão; escuro só se o visitante escolheu antes.
      var dark = false;
      try {
        dark = localStorage.getItem('vks-theme') === 'dark';
      } catch (e) {}
      if (!dark) document.documentElement.dataset.theme = 'light';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
